name: nightly-refresh

# Pulls Capital IQ daily OHLCV into the shared Postgres cache, then refreshes
# company fundamentals (scripts.fundamentals). Every price attempt is recorded
# in price_refresh_runs so failures are visible beyond the GitHub log.
# This job is the dashboard's nightly historical backbone.
#
# Requires a DATABASE_URL repo secret pointing at the SAME Postgres (Supabase)
# the deployed backend reads; without it the scripts would write to an ephemeral
# runner-local SQLite that vanishes with the job, so we fail fast if it's unset.
#
# Schedule: 06:00 UTC daily (~01:00–02:00 ET), well after the 4pm ET close so the
# finalized daily bar is available. Runs every day; weekends simply fetch nothing
# new (the refresh is incremental from each ticker's last stored date).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-backfill full price history (not just incremental)"
        type: boolean
        default: false

# Never let two refreshes write the store at once.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install licensed Capital IQ SDK
        env:
          CIQ_SDK_URL: ${{ secrets.CIQ_SDK_URL }}
        run: |
          if [ -z "$CIQ_SDK_URL" ]; then
            echo "::error::CIQ_SDK_URL must point to the licensed spgmi_api_sdk tarball."
            exit 1
          fi
          pip install "$CIQ_SDK_URL"

      - name: Check database and Capital IQ credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SDK_USERNAME: ${{ secrets.SDK_USERNAME }}
          SDK_PASSWORD: ${{ secrets.SDK_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — refusing to run so we don't"
            echo "::error::write to an ephemeral runner-local SQLite. Add it under"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ -z "$SDK_USERNAME" ] || [ -z "$SDK_PASSWORD" ]; then
            echo "::error::SDK_USERNAME and SDK_PASSWORD repository secrets are required."
            exit 1
          fi

      - name: Refresh Capital IQ prices
        # ALPHAVANTAGE_API_KEY also drives the benchmark-constituent pull inside
        # scripts.refresh (optimization page's active-weight metrics); the script
        # skips that step quietly if the secret isn't configured.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SDK_USERNAME: ${{ secrets.SDK_USERNAME }}
          SDK_PASSWORD: ${{ secrets.SDK_PASSWORD }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          python -m scripts.refresh ${{ inputs.full && '--full' || '' }}

      - name: Refresh fundamentals
        # Non-fatal: a fundamentals hiccup (Yahoo rate-limit) shouldn't fail the
        # price refresh, which already committed above.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.fundamentals
