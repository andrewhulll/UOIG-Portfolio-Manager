# UOIG Portfolio Manager — configuration
# Single source of truth for funds, benchmarks, and analytics parameters.

source_workbook: "Portfolio Holdings.xlsx"   # legacy Google-Sheet export used to seed the DB
database: "data/portfolio.db"                 # SQLite store (reproducible from the workbook)

funds:
  - name: "Tall Firs"
    sheet: "Tall Firs"
    benchmark: "IWV"          # iShares Russell 3000 ETF (large/mid-cap core)
  - name: "Alumni Fund"
    sheet: "Alumni Fund"
    benchmark: "IWM"          # iShares Russell 2000 ETF (small/mid-cap)

market_data:
  provider: "yfinance"        # swappable adapter (Phase 1): yfinance | tiingo | fmp

# Anthropic Managed Agent triggered by the "Run market analysis" button in the
# Ask Claude dock. Created once in the Anthropic console; we reference it by id and
# start a fresh session per run. An ANTHROPIC_AGENT_ID env var overrides this.
agent_id: "agent_01RMzDAMLFimcymdi9AcYeHt"

# UOIG sector groups -> the GICS sectors they roll up, plus the iShares sector
# ETFs the sector page tracks them against. Benchmark ETFs are pulled into the
# price store by the nightly refresh (same path as the fund benchmarks), so the
# sector chart reads from the DB and works on the hosted deploy (no live calls).
sectors:
  - name: "TMT"
    gics: ["Technology", "Communication Services"]
    benchmarks: ["IYW", "IYZ", "IGM"]
  - name: "IME"
    gics: ["Industrials", "Utilities", "Basic Materials", "Energy"]
    benchmarks: ["IYJ", "IYE", "IYM", "IDU"]
  - name: "Healthcare"
    gics: ["Healthcare"]
    benchmarks: ["IYH", "IBB", "IHI"]
  - name: "Financial"
    gics: ["Financial Services", "Real Estate"]
    benchmarks: ["IYF", "IYG", "IYR"]
  - name: "Consumer"
    gics: ["Consumer Defensive", "Consumer Cyclical"]
    benchmarks: ["IYK", "IYC"]

# Display names for the iShares sector ETFs (shown on the sector chart legend/KPIs).
benchmark_names:
  IYW: "U.S. Technology"
  IYZ: "U.S. Telecom"
  IGM: "Expanded Tech"
  IYJ: "U.S. Industrials"
  IYE: "U.S. Energy"
  IYM: "U.S. Materials"
  IDU: "U.S. Utilities"
  IYH: "U.S. Healthcare"
  IBB: "Biotechnology"
  IHI: "Medical Devices"
  IYF: "U.S. Financials"
  IYG: "U.S. Financial Svcs"
  IYR: "U.S. Real Estate"
  IYK: "U.S. Consumer Staples"
  IYC: "U.S. Consumer Disc."

risk:
  beta_window_years: 3
  beta_frequency: "daily"     # daily | weekly | monthly
  risk_free: "BIL"            # T-bill ETF proxy for Sharpe
  market_proxy: "SPY"         # secondary broad-market reference (optional)
  # Each fund's beta is measured against its OWN benchmark:
  #   Tall Firs   -> IWV (Russell 3000)
  #   Alumni Fund -> IWM (Russell 2000)
