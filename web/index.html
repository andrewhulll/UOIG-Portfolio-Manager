<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UOIG Investment Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    html,body,#root{margin:0;height:100%;background:#070a12;}
    @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
    ::-webkit-scrollbar{width:9px;height:9px;}
    ::-webkit-scrollbar-thumb{background:#1d2840;border-radius:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    .dc-hover:hover{filter:brightness(1.35);}
    .dc-row:hover{background:#0f1830 !important;}
    .chat-sess:hover{background:#141130 !important;}
    .chat-sess-del{opacity:0;transition:opacity .12s;}
    .chat-sess:hover .chat-sess-del{opacity:1;}
    .chat-sess-del:hover{color:#ff8a8a !important;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
