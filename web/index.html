<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UOIG Investment Terminal</title>
  <link rel="icon" type="image/png" href="/uoig-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    html,body,#root{margin:0;height:100%;background:#070a12;}
    @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
    ::-webkit-scrollbar{width:9px;height:9px;}
    ::-webkit-scrollbar-thumb{background:#1d2840;border-radius:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    .dc-hover:hover{filter:brightness(1.35);}
    .dc-row:hover{background:#0f1830 !important;}
    .chat-sess:hover{background:#141130 !important;}
    .chat-sess-del{opacity:0;transition:opacity .12s;}
    .chat-sess:hover .chat-sess-del{opacity:1;}
    .chat-sess-del:hover{color:#ff8a8a !important;}
    /* #42: PDF tear-sheets via the print dialog. Chrome (header, nav rail,
       chat, action buttons) is hidden; the 100vh scroll shell is flattened so
       content flows onto pages; the dark UI is flattened to black on white. */
    @page{margin:12mm;}
    @media print{
      .app-header,.app-nav-rail,.no-print{display:none !important;}
      html,body,#root{height:auto !important;background:#fff !important;}
      #root>div{height:auto !important;overflow:visible !important;}
      #root div{overflow:visible !important;}
      #root,#root div,#root span,#root input{background:#fff !important;background-image:none !important;color:#111 !important;border-color:#d9dee7 !important;box-shadow:none !important;text-shadow:none !important;animation:none !important;}
      #root svg{background:transparent !important;}
      #root a{color:#111 !important;text-decoration:none !important;}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
